version=2.30
# 配置文件版本号，便于升级和兼容检查

# -*- coding: utf-8 -*-
# BidGuard 文档相似度检测配置文件
# 编码：UTF-8
# 修改此文件后无需重新编译，重启程序即可生效

# ========== 段落分割参数 ==========
# 段落最小长度（字符数），低于此长度的行会被过滤
paragraph.min.length=30

# ========== 子串匹配参数 ==========
# 子串最小匹配长度（字符数，），连续相同片段的最小长度
# 修改为30字符，可检测到约15个汉字的连续重复（原值100太大，会遗漏很多重复片段）
substring.min.length=30

# ========== 段落相似度参数 ==========
# 段落相似度阈值（0-100），超过此阈值的段落会被标记为相似
paragraph.similarity.threshold=85

# ========== 综合相似度权重 ==========
# 词汇相似度权重（0-1），推荐 0.4，其它两个关掉，这里得是1
similarity.weight.lexical=1
# 语义相似度（TF-IDF）权重（0-1），推荐 0.45，初期先关掉。
similarity.weight.semantic=0
# 结构相似度权重（0-1），推荐 0.15，初期先关掉。
similarity.weight.structural=0
# 注意：三个权重之和应该等于 1.0

# ========== 相似度等级判定阈值 ==========
# 高度相似阈值（大文档 >10000字符）
similarity.level.high.large=75.0
# 高度相似阈值（中文档 >5000字符）
similarity.level.high.medium=70.0
# 高度相似阈值（小文档）
similarity.level.high.small=65.0

# ========== N-gram 参数 ==========
# 2-gram 和 3-gram 用于计算词汇相似度
ngram.size.2=2         # N-gram窗口大小为2
ngram.size.3=3         # N-gram窗口大小为3

# ========== 其他参数 ==========
# 预览文本最大字符数
preview.max.chars=200  # 查重报告预览文本最大字符数
# 调试模式：是否输出详细的PDF内容
debug.print.pdf.content=false  # 是否打印PDF内容到日志

# ========== 文本标准化参数 ==========
# 判断中文文本的空格比例阈值（0-1），低于此比例认为是中文文本
tfidf.chinese.text.space.ratio=0.1  # 中文文本空格比例阈值
# 短文本长度阈值（字符数），短于此长度的文本需要特殊处理
tfidf.short.text.length=3           # TF-IDF短文本长度阈值
# 最小词长（字符数），过滤掉长度不足的词
tfidf.min.word.length=1             # TF-IDF最小词长

# ========== 结构相似度权重分配 ==========
# 结构相似度计算中段落数量的权重（0-1）
structural.weight.paragraph=0.4     # 段落数量权重
# 结构相似度计算中文档长度的权重（0-1）
structural.weight.length=0.3        # 文档长度权重
# 结构相似度计算中词汇密度的权重（0-1）
structural.weight.density=0.3       # 词汇密度权重
# 注意：以上三个权重之和应该等于 1.0

# ========== 文档长度分级阈值 ==========
# 大型文档字符数阈值（>此值为大文档）
doc.length.large.threshold=10000    # 大文档字符数阈值
# 中型文档字符数阈值（>此值为中文档）
doc.length.medium.threshold=5000    # 中文档字符数阈值

# ========== 相似度判定阈值 ==========
# 中等相似度阈值比例（相对于高相似度阈值的比例）
similarity.level.medium.ratio=0.6   # 中等相似度阈值比例

# 文档分析阈值
analysis.lexical.very.high=80.0     # 词汇相似度极高阈值
analysis.semantic.very.high=70.0    # 语义相似度极高阈值
analysis.semantic.very.low=10.0     # 语义相似度极低阈值
analysis.structural.almost.same=95.0 # 结构相似度几乎完全相同阈值
analysis.structural.very.high=90.0  # 结构相似度极高阈值
analysis.overall.plagiarism=85.0    # 综合相似度判定为抄袭阈值
analysis.overall.similar=60.0       # 综合相似度判定为相似阈值
analysis.overall.some.similarity=30.0 # 综合相似度判定为部分相似阈值

# ========== 调试输出参数 ==========
# PDF调试输出行数限制
debug.pdf.print.lines=20            # PDF调试输出最大行数
# 段落匹配调试输出数量限制
debug.match.print.limit=5           # 段落匹配调试输出最大数量

# ========== OCR 图片压缩参数 ==========
# OCR识别前图片压缩最大边长（像素）
# 推荐值说明：
#   - 800-1000px：快速模式，识别率较低（不推荐用于正式文档）
#   - 1200-1500px：平衡模式，识别率较高且速度可接受 ✓ 推荐
#   - 1800-2000px：高质量模式，识别率最高但速度较慢
#   - 2500+px：超高质量，适合模糊扫描件，但非常慢
ocr.image.max.dimension=1200        # OCR图片最大边长

# JPEG压缩质量（0.0-1.0）
# 0.85-0.90 推荐，在文件大小和质量间取得平衡
ocr.jpeg.quality=0.85               # OCR图片JPEG压缩质量

# ========== OCR 渲染参数 ==========
# PDF渲染为图片时的DPI（影响OCR识别精度和处理速度）
# 推荐值说明：
#   - 150 DPI：快速模式，适合简单文档
#   - 200 DPI：标准模式，识别率与速度平衡 ✓ 推荐
#   - 300 DPI：高质量模式，识别率高但速度较慢
# 注意：此参数影响PDF标注的坐标转换，修改后需重新OCR识别
ocr.render.dpi=200                  # PDF渲染为图片的DPI

# 是否在OCR识别前去除红章（预留功能，当前默认关闭）
# true: 去除红章后再识别，可提高印章重叠区域的文字识别率
# false: 直接识别原图
# 注意：此功能属于实验性功能，建议先测试效果
ocr.remove.seal.enabled=false       # OCR前是否去除红章

# ========== OCR 服务配置 ==========
# OCR 服务类型: local(本地EasyOCR服务) 或 aliyun(阿里云OCR)
ocr.type=aliyun                     # OCR服务类型

# 本地 OCR 服务地址（仅当 ocr.type=local 时使用）
ocr.local.url=http://localhost:5001/ocr # 本地OCR服务地址

# 阿里云 OCR 配置（仅当 ocr.type=aliyun 时使用）
# 阿里云 Access Key ID
# 阿里云 Access Key Secret
# 阿里云 OCR 配置（仅当 ocr.type=aliyun 时使用）
# 阿里云 Access Key 已从此文件移除
# 为避免将敏感密钥提交到版本库，请在本地创建未提交文件 `local.properties`
# 并在其中添加以下两项（示例）：
# ocr.aliyun.access.key.id=你的AccessKeyId
# ocr.aliyun.access.key.secret=你的AccessKeySecret
# 阿里云 OCR API 端点
ocr.aliyun.endpoint=ocr-api.cn-hangzhou.aliyuncs.com # 阿里云OCR API端点